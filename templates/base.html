<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KSP 存档管理器{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'core:home' %}">KSP 存档管理器</a>
    <ul class="navbar-nav me-auto">
      {# 导航只有这 3 个前台页面；Admin 保留代码但不放入口（改造文档 10 第 5.4 节）#}
      <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}">存档</a></li>
      <li class="nav-item"><a class="nav-link" href="/reference/">参考数据</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'ops:schedule' %}">发射日程</a></li>
    </ul>
  </div>
</nav>

<main class="container my-4">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }} alert-dismissible">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</main>

<footer class="container text-muted small pb-4">
  rockets-manage-2 · Django 5.2 + SQLite · 个人自用 · 数据存于本地 SQLite
</footer>
</body>
</html>
