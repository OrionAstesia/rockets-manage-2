<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KSP 航天计划管理器{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'core:home' %}">KSP 航天计划管理器</a>
    <ul class="navbar-nav me-auto">
      {# 导航只有这 3 个前台页面 + 后台（规格 §8.2）；前台无表单、无写操作 #}
      <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}">首页</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'ops:schedule' %}">发射日程</a></li>
      <li class="nav-item"><a class="nav-link" href="/admin/">后台管理</a></li>
    </ul>
  </div>
</nav>

<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<footer class="container text-muted small pb-4">
  rockets-manage-2 · Django 5.2 + SQLite · 写操作全部在<a href="/admin/">后台</a>
</footer>
</body>
</html>
